<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<title>מדריך ריו פאלאס זנזיבר</title>
<meta name="theme-color" content="#0b4f55">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

<style>
  :root{
    --teal-900:#06363b; --teal-800:#0b4f55; --teal-700:#0f646b; --teal-600:#13808a; --teal-100:#dff1f1;
    --sand-50:#fbf7ef; --sand-100:#f5ecdb; --sand-200:#ecdcbf; --sand-400:#c9a979;
    --gold:#d99a1e; --gold-dark:#b07b0f; --coral:#e8603c;
    --ink:#17282a; --muted:#5d6f71; --card:#ffffff; --line:#e7e0d2;
    --shadow:0 1px 2px rgba(6,54,59,.06),0 6px 18px rgba(6,54,59,.08);
    --shadow-lg:0 10px 40px rgba(6,54,59,.22);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:'Heebo',system-ui,sans-serif;background:var(--sand-50);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}

  /* ---------- App shell ---------- */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header.top{background:linear-gradient(135deg,var(--teal-900),var(--teal-700));color:#fff;padding:12px 16px 10px;box-shadow:0 2px 12px rgba(0,0,0,.15);z-index:500;position:relative}
  .brand-sub{color:#bfe3e3;font-size:12.5px}
  .search-wrap{position:relative;flex:1;min-width:0}
  .search-wrap input{width:100%;border:0;border-radius:12px;padding:10px 38px 10px 12px;font:inherit;font-size:14.5px;background:rgba(255,255,255,.96);color:var(--ink);outline:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .search-wrap input:focus{box-shadow:0 0 0 3px rgba(217,154,30,.55)}
  .search-wrap svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--teal-700)}
  .btn-top{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:.2s}
  .btn-top:hover{background:rgba(255,255,255,.2)}
  .btn-top.on{background:var(--gold);border-color:var(--gold);color:#1d1404}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#1d1404}
  .btn-gold:hover{background:#e8aa2c}

  .pills{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
  .pills::-webkit-scrollbar{display:none}
  .pill{flex:0 0 auto;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;border:1px solid rgba(255,255,255,.28);color:#e8f6f6;background:transparent;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
  .pill:hover{background:rgba(255,255,255,.12)}
  .pill.active{background:#fff;color:var(--teal-800);border-color:#fff;font-weight:700}
  .pill .cnt{font-size:11px;opacity:.75;background:rgba(0,0,0,.08);padding:0 6px;border-radius:999px}

  main.split{flex:1;display:flex;min-height:0;position:relative}
  #listPane{width:45%;display:flex;flex-direction:column;min-height:0;background:var(--sand-50);border-left:1px solid var(--line)}
  #mapPane{width:55%;position:relative;min-height:0}
  #map{position:absolute;inset:0;background:#cfe7ea}
  #list{flex:1;overflow-y:auto;padding:12px 14px 110px;scroll-behavior:smooth}

  /* ---------- Hotel pinned card ---------- */
  .hotel-card{position:sticky;top:0;z-index:5;margin:0;padding:12px 14px;background:linear-gradient(135deg,#fff8e7,#fdf0d2);border-bottom:1px solid #f0d9a4;display:flex;gap:12px;align-items:center;cursor:pointer}
  .hotel-ico{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#f3c14d,var(--gold-dark));display:grid;place-items:center;font-size:21px;box-shadow:0 4px 12px rgba(176,123,15,.35);flex:0 0 auto}

  /* ---------- POI cards ---------- */
  .result-meta{font-size:12.5px;color:var(--muted);margin:2px 2px 10px;display:flex;justify-content:space-between;align-items:center}
  .card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 14px 12px;margin-bottom:12px;border:2px solid transparent;transition:border-color .25s, box-shadow .25s, transform .25s;cursor:pointer;position:relative;overflow:hidden}
  .card:hover{box-shadow:0 2px 4px rgba(6,54,59,.06),0 10px 26px rgba(6,54,59,.12)}
  .card.selected{border-color:var(--gold);box-shadow:0 0 0 4px rgba(217,154,30,.18),var(--shadow)}
  .card.flash{animation:flash 1.1s ease}
  @keyframes flash{0%{transform:scale(1)}25%{transform:scale(1.015)}100%{transform:scale(1)}}
  .card .stripe{position:absolute;top:0;right:0;width:5px;height:100%}
  .badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .hl{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:10px;background:linear-gradient(135deg,#2a1a5e,#5b3fb5);color:#fff;margin-top:8px}
  .hl.trip{background:linear-gradient(135deg,#8a4b08,#d99a1e)}
  .hl.run{background:linear-gradient(135deg,#a8361a,var(--coral))}
  .card h3{font-size:16.5px;font-weight:700;line-height:1.3;margin:0}
  .card .en{font-size:12px;color:var(--muted);direction:ltr;text-align:right}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:11px 0 9px}
  .stat{background:var(--sand-50);border:1px solid var(--line);border-radius:11px;padding:6px 8px;text-align:center}
  .stat b{display:block;font-size:14px;font-weight:700;color:var(--teal-800)}
  .stat span{font-size:11px;color:var(--muted)}
  .desc{font-size:13.6px;line-height:1.6;color:#2c3d3f;margin:0}
  .tips{list-style:none;margin:9px 0 0;padding:0;display:grid;gap:5px}
  .tips li{font-size:12.8px;line-height:1.5;color:#33474a;display:flex;gap:7px}
  .tips li .ti{flex:0 0 18px;text-align:center}
  .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn-nav{display:inline-flex;align-items:center;gap:6px;background:var(--teal-700);color:#fff;font-size:13px;font-weight:600;padding:8px 13px;border-radius:10px;text-decoration:none;transition:.18s}
  .btn-nav:hover{background:var(--teal-800)}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;background:transparent;color:var(--teal-700);border:1px solid #bcd9da;font:inherit;font-size:13px;font-weight:600;padding:7px 12px;border-radius:10px;cursor:pointer}
  .btn-ghost:hover{background:var(--teal-100)}
  .empty{text-align:center;color:var(--muted);padding:40px 10px;font-size:14px}

  /* ---------- Markers ---------- */
  .poi-pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.3);transition:transform .2s}
  .poi-pin span{transform:rotate(45deg);font-size:15px;line-height:1}
  .poi-pin.sel{transform:rotate(-45deg) scale(1.25);box-shadow:0 0 0 5px rgba(217,154,30,.45),0 4px 14px rgba(0,0,0,.35)}
  .home-pin{position:relative;width:52px;height:52px}
  .home-pin .core{position:absolute;inset:6px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:linear-gradient(135deg,#f6cd5c,var(--gold-dark));border:3px solid #fff;box-shadow:0 4px 16px rgba(176,123,15,.55);display:grid;place-items:center}
  .home-pin .core span{transform:rotate(45deg);font-size:19px}
  .home-pin .pulse{position:absolute;inset:0;border-radius:50%;background:rgba(217,154,30,.35);animation:pulse 2.2s infinite}
  @keyframes pulse{0%{transform:scale(.55);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .route-end{background:#fff;color:var(--coral);border:2px solid var(--coral);border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.2);font-family:'Heebo',sans-serif;text-align:center}

  /* ---------- Leaflet popup ---------- */
  .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:var(--shadow-lg)}
  .leaflet-popup-content{margin:12px 14px;font-family:'Heebo',sans-serif;direction:rtl;text-align:right;min-width:220px}
  .pp-title{font-weight:700;font-size:15px;margin:4px 0 2px;color:var(--ink)}
  .pp-row{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin:6px 0 10px;flex-wrap:wrap}
  .pp-row b{color:var(--teal-800)}
  .pp-desc{font-size:12.8px;line-height:1.5;color:#33474a;margin:0 0 10px}
  .pp-actions{display:flex;gap:6px;flex-wrap:wrap}
  .pp-actions a,.pp-actions button{font-family:inherit;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:9px;text-decoration:none;cursor:pointer}
  .pp-actions a{background:var(--teal-700);color:#fff !important}
  .pp-actions button{background:#fff;border:1px solid #bcd9da;color:var(--teal-700)}
  .leaflet-container{font-family:'Heebo',sans-serif}
  .leaflet-tooltip.route-tip{background:var(--coral);color:#fff;border:0;font-weight:600;font-family:'Heebo',sans-serif;border-radius:8px}
  .leaflet-tooltip.route-tip:before{display:none}

  /* ---------- Map overlay controls ---------- */
  .map-legend{position:absolute;bottom:14px;right:14px;z-index:450;background:rgba(255,255,255,.95);backdrop-filter:blur(6px);border-radius:12px;padding:8px 11px;font-size:12px;box-shadow:var(--shadow);display:grid;gap:4px}
  .map-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px;vertical-align:middle}
  .map-legend .dash{width:20px;height:0;border-top:3px dashed var(--coral);border-radius:0}
  .map-recenter{position:absolute;top:12px;right:12px;z-index:450;background:#fff;border:0;border-radius:12px;padding:8px 12px;font:inherit;font-size:13px;font-weight:600;color:var(--teal-800);box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:6px}
  .map-recenter:hover{background:var(--sand-100)}

  /* ---------- Mobile toggle ---------- */
  #viewToggle{display:none;position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:900;background:var(--teal-900);color:#fff;border-radius:999px;padding:5px;box-shadow:var(--shadow-lg);gap:4px}
  #viewToggle button{border:0;background:transparent;color:#cfe9e9;font:inherit;font-weight:600;font-size:14px;padding:9px 18px;border-radius:999px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:.2s}
  #viewToggle button.on{background:var(--gold);color:#1d1404}

  /* ---------- Itinerary modal ---------- */
  #itin{position:fixed;inset:0;z-index:1200;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(6,30,33,.55);backdrop-filter:blur(3px)}
  #itin.open{display:flex}
  .itin-box{background:var(--sand-50);width:100%;max-width:720px;max-height:92dvh;border-radius:22px;box-shadow:var(--shadow-lg);display:flex;flex-direction:column;overflow:hidden;animation:pop .25s ease}
  @keyframes pop{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .itin-head{background:linear-gradient(135deg,var(--teal-900),var(--teal-700));color:#fff;padding:16px 18px 0}
  .day-tabs{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{flex:1 0 auto;border:0;background:rgba(255,255,255,.1);color:#d7eeee;font:inherit;padding:8px 12px 10px;border-radius:12px 12px 0 0;cursor:pointer;text-align:center;line-height:1.25;min-width:84px}
  .day-tab b{display:block;font-size:15px}
  .day-tab small{font-size:11.5px;opacity:.85}
  .day-tab.on{background:var(--sand-50);color:var(--teal-800)}
  .day-tab.party:not(.on){background:rgba(124,58,237,.45);color:#fff}
  .itin-body{overflow-y:auto;padding:16px 18px 20px}
  .tl{position:relative;padding-right:22px}
  .tl:before{content:"";position:absolute;right:7px;top:6px;bottom:6px;width:2px;background:var(--sand-200)}
  .tl-item{position:relative;margin-bottom:12px;background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
  .tl-item:before{content:"";position:absolute;right:-20px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--teal-600);border:2px solid var(--sand-50);box-shadow:0 0 0 2px var(--teal-600)}
  .tl-item.star{background:linear-gradient(135deg,#2a1a5e,#5b3fb5);color:#fff}
  .tl-item.star:before{background:#f6cd5c;box-shadow:0 0 0 2px #f6cd5c}
  .tl-item.star .tl-time{color:#f6cd5c}
  .tl-item.star p{color:#e6defc}
  .tl-time{font-size:12.5px;font-weight:700;color:var(--teal-700)}
  .tl-item h4{margin:2px 0 3px;font-size:15px;font-weight:700}
  .tl-item p{margin:0;font-size:13px;line-height:1.55;color:#3c5052}
  .tl-link{margin-top:7px;display:inline-flex;align-items:center;gap:5px;font:inherit;font-size:12.5px;font-weight:600;border:0;background:var(--teal-100);color:var(--teal-800);padding:5px 10px;border-radius:8px;cursor:pointer}
  .tl-item.star .tl-link{background:rgba(255,255,255,.18);color:#fff}
  .day-intro{background:var(--sand-100);border-radius:12px;padding:10px 12px;font-size:13px;color:#4a3b20;margin-bottom:14px;line-height:1.55}
  .close-x{border:0;background:rgba(255,255,255,.15);color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;cursor:pointer;display:grid;place-items:center}
  .close-x:hover{background:rgba(255,255,255,.28)}

  /* ---------- Base-layer switcher (מפה / לוויין) ---------- */
  .layer-switch{position:absolute;top:12px;left:56px;z-index:450;display:flex;background:#fff;border-radius:12px;padding:4px;box-shadow:var(--shadow);gap:2px}
  .layer-switch button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:var(--teal-800);padding:6px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.18s}
  .layer-switch button:hover{background:var(--sand-100)}
  .layer-switch button.on{background:var(--teal-800);color:#fff}
  .layer-switch button:focus-visible,.map-recenter:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* ---------- Marker clusters ---------- */
  .leaflet-cluster-anim .leaflet-marker-icon,.leaflet-cluster-anim .leaflet-marker-shadow{transition:transform .3s ease-out,opacity .3s ease-in}
  .leaflet-cluster-spider-leg{transition:stroke-dashoffset .3s ease-out,stroke-opacity .3s ease-in}
  .cl{width:46px;height:46px;border-radius:50%;padding:4px;box-shadow:0 3px 12px rgba(0,0,0,.3),0 0 0 3px rgba(255,255,255,.9);transition:transform .15s}
  .cl:hover{transform:scale(1.08)}
  .cl span{width:100%;height:100%;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--teal-800);font-family:'Heebo',sans-serif}
  .map-legend .clu{width:12px;height:12px;border-radius:50%;background:conic-gradient(#7c3aed 0 120deg,#e8603c 120deg 240deg,#0891b2 240deg)}

  /* ---------- Responsive ---------- */
  @media (max-width: 860px){
    #listPane,#mapPane{width:100%;position:absolute;inset:0;border:0}
    #viewToggle{display:flex}
    body.view-list #mapPane{visibility:hidden;pointer-events:none}
    body.view-map #listPane{display:none}
    .map-legend{bottom:84px;right:10px}
    .brand-sub{display:none}
    header.top{padding:10px 12px 8px}
    #list{padding:12px 12px 110px}
    .btn-top .lbl{display:none}
  }
  @media (max-width: 380px){
    .stats{gap:4px}
    .stat b{font-size:13px}
  }
</style>
</head>
<body class="view-list">
<div id="app">
  <!-- ===== Header ===== -->
  <header class="top">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="hotel-ico" style="width:38px;height:38px;font-size:18px">🌴</div>
        <div class="min-w-0">
          <h1 class="text-[17px] sm:text-[19px] font-extrabold leading-tight truncate">המדריך שלי לזנזיבר</h1>
          <div class="brand-sub">סביב Riu Palace Zanzibar · נונגווי וקנדווה · 19–22 בנובמבר</div>
        </div>
      </div>
      <button id="openItin" class="btn-top btn-gold" title="מסלול 4 ימים">
        <span>🗓️</span><span>מסלול 4 ימים</span>
      </button>
    </div>

    <div class="flex items-center gap-2 mt-3">
      <label class="search-wrap" aria-label="חיפוש">
        <input id="search" type="search" placeholder="חיפוש מקום, אוכל, ריצה, צלילה…" autocomplete="off">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </label>
      <button id="sortBtn" class="btn-top" aria-pressed="false" title="מיון לפי מרחק מהמלון">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 6h13M3 12h9M3 18h5M18 4v16m0 0-3-3m3 3 3-3"/></svg>
        <span class="lbl">לפי מרחק</span>
      </button>
    </div>

    <nav class="pills" id="pills" aria-label="קטגוריות"></nav>
  </header>

  <!-- ===== Split view ===== -->
  <main class="split">
    <section id="listPane" aria-label="רשימת מקומות">
      <div class="hotel-card" id="hotelCard" title="הצג את המלון במפה">
        <div class="hotel-ico">🏨</div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2 flex-wrap">
            <strong class="text-[15.5px]">Riu Palace Zanzibar</strong>
            <span class="badge" style="background:#f6cd5c;color:#4a3304">⭐ נקודת הבית</span>
          </div>
          <div class="text-[12.5px] text-[#6b5320] mt-0.5">Nungwi Road · חוף קנדווה–נונגווי · כל המרחקים מחושבים מכאן</div>
        </div>
        <a class="btn-nav" style="background:var(--gold-dark);padding:7px 10px" target="_blank" rel="noopener"
           href="https://www.google.com/maps/search/?api=1&query=-5.7366,39.2912" onclick="event.stopPropagation()">📍</a>
      </div>
      <div id="list"></div>
    </section>

    <section id="mapPane" aria-label="מפה">
      <div id="map"></div>
      <button class="map-recenter" id="recenter">🏨 חזרה למלון</button>
      <div class="layer-switch" id="layerSwitch" role="radiogroup" aria-label="סוג מפה">
        <button data-layer="street" class="on" role="radio" aria-checked="true">🗺️ מפה</button>
        <button data-layer="satellite" role="radio" aria-checked="false">🛰️ לוויין</button>
      </div>
      <div class="map-legend" id="legend"></div>
    </section>
  </main>
</div>

<!-- ===== Mobile view toggle ===== -->
<div id="viewToggle" role="tablist">
  <button data-view="map" role="tab">🗺️ מפה</button>
  <button data-view="list" class="on" role="tab">📋 רשימה</button>
</div>

<!-- ===== Itinerary modal ===== -->
<div id="itin" role="dialog" aria-modal="true" aria-labelledby="itinTitle">
  <div class="itin-box">
    <div class="itin-head">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h2 id="itinTitle" class="text-[19px] font-extrabold">מסלול מוצע · 4 ימים בצפון זנזיבר</h2>
          <p class="text-[12.5px] text-[#bfe3e3] mt-0.5">חמישי 19.11 – ראשון 22.11 · שיא: מסיבת הירח המלא בקנדווה רוקס, שבת 21.11</p>
        </div>
        <button class="close-x" id="closeItin" aria-label="סגירה">×</button>
      </div>
      <div class="day-tabs" id="dayTabs"></div>
    </div>
    <div class="itin-body" id="dayBody"></div>
  </div>
</div>

<script>
/* =========================================================
   DATA
   ========================================================= */

      ['⏰','רוב החנויות פתוחות בערך 08:00–21:00.']
    ]
  }
];

/* =========================================================
   HELPERS
   ========================================================= */
const toRad = d => d * Math.PI / 180;
function haversine(a, b) {
  const R = 6371;
  const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function routeLength(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += haversine({lat:pts[i-1][0],lng:pts[i-1][1]},{lat:pts[i][0],lng:pts[i][1]});
  return s;
}
const fmtMin = m => {
  if (m == null) return '—';
  if (m < 60) return `${Math.max(1, Math.round(m))} דק׳`;
  const h = Math.floor(m / 60), r = Math.round(m % 60);
  return r ? `${h} ש׳ ${r} דק׳` : `${h} ש׳`;
};
const fmtKm = km => km < 1 ? `${Math.round(km * 1000)} מ׳` : `${km.toFixed(km < 10 ? 1 : 0)} ק״מ`;
const gmapsDir = (lat, lng) => `https://www.google.com/maps/dir/?api=1&origin=${HOTEL.lat},${HOTEL.lng}&destination=${lat},${lng}`;
const isMobile = () => window.matchMedia('(max-width: 860px)').matches;

const RUN_KM = routeLength(RUN_ROUTE);

/* Pre-compute distance / walking / taxi times */
POIS.forEach(p => {
  const straight = haversine(HOTEL, p);
  p.dist = p.distOverride ?? straight;
  if (p.isRoute) {
    p.dist = RUN_KM;
    p.walk = RUN_KM / 5 * 60;          // walking the whole stretch @ 5 km/h
    p.run = RUN_KM / 10 * 60;          // easy running @ 6:00 min/km
    p.taxi = null;
    p.sortDist = 0;
    return;
  }
  p.sortDist = p.dist;
  // Beach walk ≈ 1.15× straight line; road walk ≈ 1.35×, at 4.8 km/h
  if (p.walk === undefined) {
    const factor = p.walkVia === 'חוף' ? 1.15 : 1.35;
    p.walk = straight * factor / 4.8 * 60;
  }
  // Taxi: road detour ×1.5 at ~25 km/h on Nungwi road + 3 min pickup/turnaround
  if (p.taxi === undefined) p.taxi = straight * 1.5 / 25 * 60 + 3;
});

/* =========================================================
   STATE
   ========================================================= */
const state = { cat: 'all', q: '', sortByDist: false, selected: null };

/* =========================================================
   MAP
   ========================================================= */
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([HOTEL.lat, HOTEL.lng], 14);
L.control.zoom({ position: 'topleft' }).addTo(map);
/* Keyless base layers: OpenStreetMap (default) + Esri World Imagery (satellite) */
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
const baseLayers = {
  street: L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }),
  satellite: L.tileLayer(ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, maxNativeZoom: 18,
    attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
  })
};
/* Safety net: if OSM refuses tiles (e.g. opened from a local file without a referrer),
   swap the street layer for Esri's keyless World Street Map */
let osmOk = 0, osmFail = 0, usingFallback = false;
baseLayers.street.on('tileload', () => osmOk++);
baseLayers.street.on('tileerror', () => {
  if (usingFallback || ++osmFail < 4 || osmOk > 0) return;
  usingFallback = true;
  const wasOn = map.hasLayer(baseLayers.street);
  if (wasOn) map.removeLayer(baseLayers.street);
  baseLayers.street = L.tileLayer(ESRI + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19, maxNativeZoom: 18, attribution: 'Map &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
  });
  if (wasOn) baseLayers.street.addTo(map);
});
let activeBase = 'street';
baseLayers.street.addTo(map);
function setBase(name) {
  if (name === activeBase) return;
  map.removeLayer(baseLayers[activeBase]);
  baseLayers[name].addTo(map);
  activeBase = name;
  document.querySelectorAll('#layerSwitch button').forEach(b => {
    const on = b.dataset.layer === name;
    b.classList.toggle('on', on); b.setAttribute('aria-checked', on);
  });
  try { localStorage.setItem('znz-base', name); } catch (e) {}
}
document.getElementById('layerSwitch').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) setBase(b.dataset.layer);
});
L.DomEvent.disableClickPropagation(document.getElementById('layerSwitch'));
try { if (localStorage.getItem('znz-base') === 'satellite') setBase('satellite'); } catch (e) {}

/* Running route */
const routeGroup = L.layerGroup().addTo(map);
L.polyline(RUN_ROUTE, { color: '#ffffff', weight: 9, opacity: .85, lineCap: 'round' }).addTo(routeGroup);
const routeLine = L.polyline(RUN_ROUTE, { color: '#e8603c', weight: 4.5, dashArray: '10 9', lineCap: 'round' })
  .addTo(routeGroup)
  .bindTooltip(`🏃 מסלול ריצת חוף · ${RUN_KM.toFixed(1)} ק״מ`, { sticky: true, direction: 'top', className: 'route-tip' });
routeLine.on('click', () => selectPoi('run-route', { fromMap: true }));
const endIcon = txt => L.divIcon({ className: '', html: `<div class="route-end">${txt}</div>`, iconSize: [90, 22], iconAnchor: [45, 11] });
L.marker(RUN_ROUTE[0], { icon: endIcon('קצה קנדווה'), interactive: false }).addTo(routeGroup);
L.marker(RUN_ROUTE[RUN_ROUTE.length - 1], { icon: endIcon('קצה נונגווי'), interactive: false }).addTo(routeGroup);

/* Home marker */
const homeIcon = L.divIcon({ className: '', html: '<div class="home-pin"><div class="pulse"></div><div class="core"><span>🏨</span></div></div>', iconSize: [52, 52], iconAnchor: [26, 46], popupAnchor: [0, -40] });
const homeMarker = L.marker([HOTEL.lat, HOTEL.lng], { icon: homeIcon, zIndexOffset: 2000 }).addTo(map)
  .bindPopup(`
    <span class="badge" style="background:#f6cd5c;color:#4a3304">⭐ נקודת הבית</span>
    <div class="pp-title">Riu Palace Zanzibar</div>
    <p class="pp-desc">המלון שלכם על חוף נונגווי רואד. מכאן מחושבים כל המרחקים וזמני ההליכה והמונית.</p>
    <div class="pp-actions"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${HOTEL.lat},${HOTEL.lng}">📍 פתח ב-Google Maps</a></div>`);

/* POI markers */
const markers = {};
function pinIcon(p, selected) {
  const c = CATS[p.cat];
  return L.divIcon({
    className: '',
    html: `<div class="poi-pin ${selected ? 'sel' : ''}" style="background:${c.color}"><span>${p.isRoute ? '🏃' : p.isTrip ? '🏛️' : c.icon}</span></div>`,
    iconSize: [34, 34], iconAnchor: [17, 34], popupAnchor: [0, -32]
  });
}
function popupHtml(p) {
  const c = CATS[p.cat];
  const timeRow = p.isRoute
    ? `<span>📏 <b>${fmtKm(p.dist)}</b></span><span>🏃 <b>${fmtMin(p.run)}</b></span><span>🚶 <b>${fmtMin(p.walk)}</b></span>`
    : `<span>📏 <b>${fmtKm(p.dist)}</b></span><span>🚶 <b>${p.walk == null ? 'לא רלוונטי' : fmtMin(p.walk)}</b></span><span>🚕 <b>${fmtMin(p.taxi)}</b></span>`;
  return `
    <span class="badge" style="background:${c.bg};color:${c.color}">${c.icon} ${c.label}</span>
    <div class="pp-title">${p.he}</div>
    <div class="pp-row">${timeRow}</div>
    <p class="pp-desc">${p.desc.length > 150 ? p.desc.slice(0, 148) + '…' : p.desc}</p>
    <div class="pp-actions">
      <a target="_blank" rel="noopener" href="${gmapsDir(p.lat, p.lng)}">🧭 נווט ב-Google Maps</a>
      <button onclick="showCard('${p.id}')">📋 לכרטיס המלא</button>
    </div>`;
}
/* Cluster group: close Nungwi venues merge into one tappable badge whose ring
   shows the mix of categories; at max zoom they fan out (spiderfy) */
const cluster = L.markerClusterGroup({
  maxClusterRadius: 42,
  disableClusteringAtZoom: 18,
  spiderfyOnMaxZoom: true,
  spiderfyDistanceMultiplier: 1.7,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
  spiderLegPolylineOptions: { weight: 2, color: '#0b4f55', opacity: .6 },
  iconCreateFunction: c => {
    const ms = c.getAllChildMarkers();
    const counts = {};
    ms.forEach(m => counts[m.options.poiCat] = (counts[m.options.poiCat] || 0) + 1);
    let deg = 0;
    const stops = CAT_ORDER.filter(k => counts[k]).map(k => {
      const from = deg; deg += counts[k] / ms.length * 360;
      return `${CATS[k].color} ${from}deg ${deg}deg`;
    }).join(',');
    return L.divIcon({
      className: '',
      html: `<div class="cl" style="background:conic-gradient(${stops})" title="${ms.length} מקומות – הקישו להגדלה"><span>${ms.length}</span></div>`,
      iconSize: [46, 46], iconAnchor: [23, 23]
    });
  }
}).addTo(map);

POIS.forEach(p => {
  const m = L.marker([p.lat, p.lng], { icon: pinIcon(p, false), riseOnHover: true, poiCat: p.cat })
    .bindPopup(popupHtml(p), { maxWidth: 290, autoPanPadding: [30, 80] });
  m.on('click', () => selectPoi(p.id, { fromMap: true }));
  markers[p.id] = m;
});
/* Open a POI popup even if its marker is currently hidden inside a cluster */
function openPoiPopup(id) {
  const m = markers[id];
  if (!cluster.hasLayer(m)) return;
  cluster.zoomToShowLayer(m, () => m.openPopup());
}

/* Legend */
document.getElementById('legend').innerHTML =
  CAT_ORDER.map(k => `<div><i style="background:${CATS[k].color}"></i>${CATS[k].label}</div>`).join('') +
  `<div><i class="dash"></i>מסלול ריצה (${RUN_KM.toFixed(1)} ק״מ)</div>` +
  `<div><i class="clu"></i>עיגול עם מספר = כמה מקומות צמודים</div>`;

function fitLocal() {
  const local = POIS.filter(p => !p.isTrip).map(p => [p.lat, p.lng]).concat(RUN_ROUTE, [[HOTEL.lat, HOTEL.lng]]);
  map.fitBounds(L.latLngBounds(local), { padding: [30, 30] });
}
fitLocal();

/* =========================================================
   LIST / FILTERS
   ========================================================= */
const listEl = document.getElementById('list');

function renderPills() {
  const counts = { all: POIS.length };
  CAT_ORDER.forEach(k => counts[k] = POIS.filter(p => p.cat === k).length);
  const items = [['all', 'הכל', '✨'], ...CAT_ORDER.map(k => [k, CATS[k].label, CATS[k].icon])];
  document.getElementById('pills').innerHTML = items.map(([k, label, ic]) =>
    `<button class="pill ${state.cat === k ? 'active' : ''}" data-cat="${k}">${ic} ${label} <span class="cnt">${counts[k]}</span></button>`
  ).join('');
}

function matches(p) {
  if (state.cat !== 'all' && p.cat !== state.cat) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  const hay = [p.he, p.en, p.desc, CATS[p.cat].label, ...p.tips.map(t => t[1])].join(' ').toLowerCase();
  return q.split(/\s+/).every(w => hay.includes(w));
}

function cardHtml(p) {
  const c = CATS[p.cat];
  const stats = p.isRoute
    ? `<div class="stat"><b>${fmtKm(p.dist)}</b><span>אורך הקטע</span></div>
       <div class="stat"><b>${fmtMin(p.run)}</b><span>ריצה (6:00/ק״מ)</span></div>
       <div class="stat"><b>${fmtMin(p.walk)}</b><span>הליכה בחוף</span></div>`
    : `<div class="stat"><b>${fmtKm(p.dist)}</b><span>${p.isTrip ? 'נסיעה מהמלון' : 'מרחק מהמלון'}</span></div>
       <div class="stat"><b>${p.walk == null ? '—' : fmtMin(p.walk)}</b><span>${p.walk == null ? 'לא בהליכה' : 'הליכה ב' + p.walkVia}</span></div>
       <div class="stat"><b>${fmtMin(p.taxi)}</b><span>${p.isTrip ? 'ברכב / מונית' : 'במונית'}</span></div>`;
  return `
  <article class="card ${state.selected === p.id ? 'selected' : ''}" id="card-${p.id}" data-id="${p.id}" tabindex="0">
    <div class="stripe" style="background:${c.color}"></div>
    <div class="flex items-start justify-between gap-2">
      <div class="min-w-0">
        <h3>${p.he}</h3>
        <div class="en">${p.en}</div>
      </div>
      <span class="badge" style="background:${c.bg};color:${c.color}">${c.icon} ${c.label}</span>
    </div>
    ${p.highlight ? `<div class="hl ${p.highlight.cls}">${p.highlight.text}</div>` : ''}
    <div class="stats">${stats}</div>
    <p class="desc">${p.desc}</p>
    <ul class="tips">${p.tips.map(t => `<li><span class="ti">${t[0]}</span><span>${t[1]}</span></li>`).join('')}</ul>
    <div class="actions">
      <a class="btn-nav" target="_blank" rel="noopener" href="${gmapsDir(p.lat, p.lng)}" onclick="event.stopPropagation()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M21.7 11.3 12.7 2.3a1 1 0 0 0-1.4 0l-9 9a1 1 0 0 0 0 1.4l9 9a1 1 0 0 0 1.4 0l9-9a1 1 0 0 0 0-1.4ZM14 14.5V12h-4v3H8v-4a1 1 0 0 1 1-1h5V7.5l3.5 3.5Z"/></svg>
        נווט ב-Google Maps
      </a>
      <button class="btn-ghost" data-fly="${p.id}">🗺️ הצג במפה</button>
    </div>
  </article>`;
}

function renderList() {
  let items = POIS.filter(matches);
  if (state.sortByDist) {
    items = items.slice().sort((a, b) => a.sortDist - b.sortDist);
  } else {
    items = items.slice().sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat));
  }
  const meta = `<div class="result-meta"><span>${items.length} מקומות${state.cat !== 'all' ? ' · ' + CATS[state.cat].label : ''}</span><span>${state.sortByDist ? '↓ מהקרוב לרחוק' : 'לפי קטגוריה'}</span></div>`;
  listEl.innerHTML = items.length
    ? meta + items.map(cardHtml).join('')
    : `<div class="empty">🔍<br>לא נמצאו מקומות התואמים לחיפוש.<br><button class="btn-ghost mt-3" id="clearSearch">ניקוי חיפוש</button></div>`;

  // Markers visibility sync
  const visible = new Set(items.map(p => p.id));
  POIS.forEach(p => {
    const m = markers[p.id];
    if (visible.has(p.id)) { if (!cluster.hasLayer(m)) cluster.addLayer(m); }
    else if (cluster.hasLayer(m)) cluster.removeLayer(m);
  });
  const showRoute = visible.has('run-route') || (state.cat === 'all' && !state.q);
  if (showRoute && !map.hasLayer(routeGroup)) routeGroup.addTo(map);
  if (!showRoute && map.hasLayer(routeGroup)) map.removeLayer(routeGroup);
}

function render() { renderPills(); renderList(); }

/* =========================================================
   SELECTION & SYNC
   ========================================================= */
function setSelectedMarker(id) {
  POIS.forEach(p => markers[p.id].setIcon(pinIcon(p, p.id === id)));
  if (id && markers[id]) markers[id].setZIndexOffset(1500);
  POIS.forEach(p => { if (p.id !== id) markers[p.id].setZIndexOffset(0); });
}

function highlightCard(id, scroll) {
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('card-' + id);
  if (!el) return;
  el.classList.add('selected');
  if (scroll) {
    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }
}

function flyToPoi(p) {
  if (p.isRoute) {
    map.flyToBounds(routeLine.getBounds(), { padding: [40, 40], duration: 1.1 });
    setTimeout(() => openPoiPopup(p.id), 1150);
    return;
  }
  // Zoom 18 = clustering is switched off, so the pin is always individually visible
  const zoom = p.isTrip ? 12 : 18;
  map.flyTo([p.lat, p.lng], zoom, { duration: p.isTrip ? 1.8 : 1.2 });
  map.once('moveend', () => setTimeout(() => {
    const m = markers[p.id];
    if (m._map) m.openPopup(); else openPoiPopup(p.id);
  }, 80));
}

function selectPoi(id, { fromMap = false } = {}) {
  const p = POIS.find(x => x.id === id);
  if (!p) return;
  state.selected = id;
  setSelectedMarker(id);
  if (fromMap) {
    // Ensure the card exists (it may be filtered out)
    if (!document.getElementById('card-' + id)) { state.cat = 'all'; state.q = ''; document.getElementById('search').value = ''; render(); }
    highlightCard(id, !isMobile());
    if (p.isRoute) openPoiPopup(id);
  } else {
    highlightCard(id, false);
    if (isMobile()) setView('map');
    setTimeout(() => flyToPoi(p), isMobile() ? 120 : 0);
  }
}

/* From popup "full card" button */
window.showCard = function (id) {
  map.closePopup();
  if (!document.getElementById('card-' + id)) { state.cat = 'all'; state.q = ''; document.getElementById('search').value = ''; render(); }
  if (isMobile()) setView('list');
  setTimeout(() => highlightCard(id, true), 60);
};

/* =========================================================
   MOBILE VIEW TOGGLE
   ========================================================= */
function setView(v) {
  document.body.classList.toggle('view-map', v === 'map');
  document.body.classList.toggle('view-list', v === 'list');
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  if (v === 'map') setTimeout(() => map.invalidateSize(), 30);
}
document.getElementById('viewToggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) setView(b.dataset.view);
});
window.addEventListener('resize', () => map.invalidateSize());

/* =========================================================
   EVENTS
   ========================================================= */
document.getElementById('pills').addEventListener('click', e => {
  const b = e.target.closest('.pill'); if (!b) return;
  state.cat = b.dataset.cat; render();
  listEl.scrollTop = 0;
});
let searchT;
document.getElementById('search').addEventListener('input', e => {
  clearTimeout(searchT);
  searchT = setTimeout(() => { state.q = e.target.value.trim(); renderList(); }, 120);
});
document.getElementById('sortBtn').addEventListener('click', e => {
  state.sortByDist = !state.sortByDist;
  e.currentTarget.classList.toggle('on', state.sortByDist);
  e.currentTarget.setAttribute('aria-pressed', state.sortByDist);
  renderList();
});
listEl.addEventListener('click', e => {
  if (e.target.id === 'clearSearch') { state.q = ''; state.cat = 'all'; document.getElementById('search').value = ''; render(); return; }
  const fly = e.target.closest('[data-fly]');
  const card = e.target.closest('.card');
  if (fly) { e.stopPropagation(); selectPoi(fly.dataset.fly); return; }
  if (card && !e.target.closest('a')) selectPoi(card.dataset.id);
});
listEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList.contains('card')) selectPoi(e.target.dataset.id);
});
function goHome() {
  state.selected = null; setSelectedMarker(null);
  document.querySelectorAll('.card.selected').forEach(el => el.classList.remove('selected'));
  if (isMobile()) setView('map');
  setTimeout(() => { map.flyTo([HOTEL.lat, HOTEL.lng], 15, { duration: 1 }); map.once('moveend', () => homeMarker.openPopup()); }, 80);
}
document.getElementById('hotelCard').addEventListener('click', goHome);
document.getElementById('recenter').addEventListener('click', goHome);

let activeDay = 2; // open on the party day by default
function renderItin() {
  document.getElementById('dayTabs').innerHTML = ITIN.map((d, i) =>
    `<button class="day-tab ${i === activeDay ? 'on' : ''} ${d.party ? 'party' : ''}" data-day="${i}"><b>${d.party ? '🌕 ' : ''}${d.day} ${d.date}</b><small>${d.title.replace('🌕 ', '')}</small></button>`
  ).join('');
  const d = ITIN[activeDay];
  document.getElementById('dayBody').innerHTML = `
    <div class="day-intro"><strong>יום ${activeDay + 1} · ${d.day} ${d.date} · ${d.title}</strong><br>${d.intro}</div>
    <div class="tl">
      ${d.items.map(it => {
        const p = it.poi && POIS.find(x => x.id === it.poi);
        return `<div class="tl-item ${it.star ? 'star' : ''}">
          <div class="tl-time">${it.t}</div>
          <h4>${it.h}</h4>
          <p>${it.p}</p>
          ${p ? `<button class="tl-link" data-goto="${p.id}">📍 ${p.he}${p.isTrip ? '' : ' · ' + fmtKm(p.dist)}</button>` : ''}
        </div>`;
      }).join('')}
    </div>`;
}
const itinEl = document.getElementById('itin');
document.getElementById('openItin').addEventListener('click', () => { renderItin(); itinEl.classList.add('open'); });
document.getElementById('closeItin').addEventListener('click', () => itinEl.classList.remove('open'));
itinEl.addEventListener('click', e => {
  if (e.target === itinEl) { itinEl.classList.remove('open'); return; }
  const tab = e.target.closest('[data-day]');
  if (tab) { activeDay = +tab.dataset.day; renderItin(); document.getElementById('dayBody').scrollTop = 0; return; }
  const go = e.target.closest('[data-goto]');
  if (go) {
    itinEl.classList.remove('open');
    if (!document.getElementById('card-' + go.dataset.goto)) { state.cat = 'all'; state.q = ''; document.getElementById('search').value = ''; render(); }
    selectPoi(go.dataset.goto);
    if (!isMobile()) highlightCard(go.dataset.goto, true);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') itinEl.classList.remove('open'); });

render();
